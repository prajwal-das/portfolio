# Portfolio — static site served by nginx.
#
# Security headers + cache policy: the app shell (index.html) always
# revalidates; hashed/static assets are immutable.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $csp "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'";

    location = /index.html {
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / {
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ /index.html;
    }
}
