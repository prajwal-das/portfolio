# Merge to main -> test -> build arm64 image -> push to Docker Hub
# (curiouspace/portfolio:latest + :sha-<short>).
# Deploying the new image is a manual `kubectl rollout restart
# deployment/portfolio -n profile` (imagePullPolicy: Always pulls the fresh image).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  - Docker Hub access token (read+write)

name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "nginx/**"
      - ".github/workflows/build-push.yml"

env:
  IMAGE: curiouspace/portfolio

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: node tests/check.js

  build-push:
    needs: test
    runs-on: ubuntu-24.04-arm # native arm64, matches the k3s nodes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
