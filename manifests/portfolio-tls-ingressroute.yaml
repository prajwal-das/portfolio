# Gives the portfolio a real HTTPS cert + clean hostname via
# k3s's bundled Traefik — https://profile.curiouspace.com.
# Same pattern as the todo repo's tls-ingressroute manifest.
#
# Requires: cert-manager installed, the ClusterIssuer
# `letsencrypt-cloudflare` applied (home-server repo).
#
# Tailnet/LAN-only by DNS: Tailscale split-DNS maps *.curiouspace.com to
# the cluster ingress, and there is no public A record, so this hostname
# only resolves on the tailnet (and on LAN via the AdGuard rewrite, if
# added: profile.curiouspace.com -> 192.168.99.101).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: profile-tls
  namespace: profile
spec:
  secretName: profile-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - profile.curiouspace.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio
  namespace: profile
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`profile.curiouspace.com`)
      kind: Rule
      services:
        - name: portfolio
          port: 80
  tls:
    secretName: profile-tls
